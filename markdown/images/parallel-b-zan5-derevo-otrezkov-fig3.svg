<svg width="760" height="295" viewBox="0 0 760 295" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="295" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Подарки: каждый дарит следующему по циклу; «не принёс» ломает двоих</text><text x="170" y="70" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">чётный цикл: через одного —</text><text x="170" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">теряются все 4</text><line x1="182.02081528017132" y1="120.0208152801713" x2="209.97918471982868" y2="147.97918471982868" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><line x1="209.97918471982868" y1="172.02081528017132" x2="182.02081528017132" y2="199.97918471982868" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><line x1="157.97918471982868" y1="199.97918471982868" x2="130.02081528017132" y2="172.02081528017132" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><line x1="130.02081528017132" y1="147.97918471982868" x2="157.97918471982868" y2="120.0208152801713" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><circle cx="170.0" cy="108.0" r="16" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="170.0" y="112.55" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">1</text><circle cx="222.0" cy="160.0" r="16" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="222.0" y="164.55" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">2</text><circle cx="170.0" cy="212.0" r="16" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="170.0" y="216.55" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">3</text><circle cx="118.0" cy="160.0" r="16" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="118.0" y="164.55" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">4</text><text x="380" y="70" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">нечётный: 2 не принесли —</text><text x="380" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">теряются 4 из 5</text><line x1="393.75328890437413" y1="117.99234928897204" x2="415.70164994297386" y2="133.9387670035307" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><line x1="424.2016499429739" y1="160.09907706952035" x2="415.8181220235827" y2="185.90092293047965" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><line x1="393.56483311920863" y1="202.06888370749726" x2="366.4351668807914" y2="202.06888370749726" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><line x1="344.1818779764173" y1="185.90092293047965" x2="335.79835005702614" y2="160.09907706952035" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><line x1="344.29835005702614" y1="133.9387670035307" x2="366.24671109562587" y2="117.99234928897204" stroke="#3b4a63" stroke-width="2" marker-end="url(#ar)"/><circle cx="380.0" cy="108.0" r="16" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="380.0" y="112.55" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">1</text><circle cx="429.454938847348" cy="143.93111629250274" r="16" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="429.454938847348" y="148.48111629250275" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">2</text><circle cx="410.56483311920863" cy="202.06888370749726" r="16" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="410.56483311920863" y="206.61888370749728" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">3</text><circle cx="349.4351668807914" cy="202.06888370749726" r="16" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="349.4351668807914" y="206.61888370749728"