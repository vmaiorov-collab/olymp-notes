<svg role="img" viewbox="0 0 760 236" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="236" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">size — сколько элементов лежит; capacity — сколько памяти выделено</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="start" x="24" y="72">заполнен</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="46" x="170" y="50"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="193.0" y="71.9">1</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="46" x="222" y="50"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="245.0" y="71.9">2</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="46" x="274" y="50"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="297.0" y="71.9">3</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="46" x="326" y="50"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="349.0" y="71.9">4</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="start" x="386" y="72">size=4, cap=4</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="start" x="24" y="134">после push_back</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="46" x="170" y="112"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="193.0" y="133.9">1</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="46" x="222" y="112"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="245.0" y="133.9">2</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="46" x="274" y="112"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="297.0" y="133.9">3</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="46" x="326" y="112"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="349.0" y="133.9">4</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="46" x="378" y="112"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="401.0" y="133.9">5</text><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="46" x="430" y="112"></rect><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="46" x="482" y="112"></rect><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="46" x="534" y="112"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="start" x="594" y="134">size=5, cap=8</text><line marker-end="url(#ar)" stroke="#ffff00" stroke-width="2" x1="380" x2="380" y1="90" y2="108"></line><text fill="#ffff00" font-size="12" font-weight="400" text-anchor="middle" x="540" y="100">size = capacity → выделяем 2·capacity, копируем</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="380" y="190">один push_back иногда дорогой (копирование), но в среднем — O(1)</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="214">(амортизированно: суммарно удвоений ≈ log n, копируется ≤ 2n элементов)</text></svg>