<svg width="760" height="236" viewBox="0 0 760 236" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="236" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">size — сколько элементов лежит; capacity — сколько памяти выделено</text><text x="24" y="72" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">заполнен</text><rect x="170" y="50" width="46" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="193.0" y="71.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">1</text><rect x="222" y="50" width="46" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="245.0" y="71.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">2</text><rect x="274" y="50" width="46" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="297.0" y="71.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">3</text><rect x="326" y="50" width="46" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="349.0" y="71.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">4</text><text x="386" y="72" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">size=4, cap=4</text><text x="24" y="134" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">после push_back</text><rect x="170" y="112" width="46" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="193.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">1</text><rect x="222" y="112" width="46" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="245.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">2</text><rect x="274" y="112" width="46" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="297.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">3</text><rect x="326" y="112" width="46" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="349.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">4</text><rect x="378" y="112" width="46" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="401.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">5</text><rect x="430" y="112" width="46" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><rect x="482" y="112" width="46" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><rect x="534" y="112" width="46" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="594" y="134" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">size=5, cap=8</text><line x1="380" y1="90" x2="380" y2="108" stroke="#ffff00" stroke-width="2" marker-end="url(#ar)"/><text x="540" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#ffff00">size = capacity → выделяем 2·capacity, копируем</text><text x="380" y="190" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">один push_back иногда дорогой (копирование), но в среднем — O(1)</text><text x="380" y="214" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">(амортизированно: суммарно удвоений ≈ log n, копируется ≤ 2n элементов)</text></svg>