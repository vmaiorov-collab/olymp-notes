<svg width="760" height="296" viewBox="0 0 760 296" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="296" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Правильные скобочные последовательности длины 2n = 8: пути не заходят выше диагонали</text><line x1="80" y1="50" x2="280" y2="50" stroke="#232d3b" stroke-width="1"/><line x1="80" y1="50" x2="80" y2="250" stroke="#232d3b" stroke-width="1"/><line x1="80" y1="90" x2="280" y2="90" stroke="#232d3b" stroke-width="1"/><line x1="120" y1="50" x2="120" y2="250" stroke="#232d3b" stroke-width="1"/><line x1="80" y1="130" x2="280" y2="130" stroke="#232d3b" stroke-width="1"/><line x1="160" y1="50" x2="160" y2="250" stroke="#232d3b" stroke-width="1"/><line x1="80" y1="170" x2="280" y2="170" stroke="#232d3b" stroke-width="1"/><line x1="200" y1="50" x2="200" y2="250" stroke="#232d3b" stroke-width="1"/><line x1="80" y1="210" x2="280" y2="210" stroke="#232d3b" stroke-width="1"/><line x1="240" y1="50" x2="240" y2="250" stroke="#232d3b" stroke-width="1"/><line x1="80" y1="250" x2="280" y2="250" stroke="#232d3b" stroke-width="1"/><line x1="280" y1="50" x2="280" y2="250" stroke="#232d3b" stroke-width="1"/><line x1="80" y1="50" x2="240" y2="210" stroke="#7c8aa0" stroke-width="2" stroke-dasharray="6 4"/><line x1="80" y1="90" x2="200" y2="210" stroke="#fc6255" stroke-width="1.5" stroke-dasharray="3 4"/><polyline points="80,50 120,50 160,50 160,90 160,130 200,130 200,170 240,170 240,210" fill="none" stroke="#83c167" stroke-width="3"/><polyline points="80,50 120,50 120,90 120,130 160,130 200,130 200,170 240,170 240,210" fill="none" stroke="#fc6255" stroke-width="3"/><polyline points="120,130 120,170 120,210 160,210 160,250 200,250" fill="none" stroke="#ff8c1a" stroke-width="3" stroke-dasharray="6 4"/><text x="266" y="216" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">(n,n)</text><text x="226" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#ff8c1a">(n−1,n+1)</text><text x="480" y="90" text-anchor="start" font-size="13" font-weight="400" fill="#83c167">зелёный — корректный путь</text><text x="480" y="116" text-anchor="start" font-size="13" font-weight="400" fill="#fc6255">красный — плохой: касается прямой y = x + 1</text><text x="480" y="140" text-anchor="start" font-size="13" font-weight="400" fill="#ff8c1a">оранжевый — остаток после первого касания,</text><text x="480" y="160" text-anchor="start" font-size="13" font-weight="400" fill="#ff8c1a">отражённый (шаги → и ↓ поменяли местами)</text><text x="480" y="204" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">плохих путей = C(2n, n−1)</text><text x="480" y="236" text-anchor="start" font-size="15" font-weight="400" fill="#ffff00">Catₙ = C(2n, n) − C(2n, n−1)</text><text x="480" y="260" text-anchor="start" font-size="15" font-weight="400" fill="#ffff00">= C(2n, n) / (n+1)</text></svg>