<svg width="760" height="214" viewBox="0 0 760 214" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="214" rx="14" fill="#141a24"/><text x="380" y="22" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Общая схема: преобразование → поэлементное действие → обратное преобразование</text><rect x="20" y="60" width="90" height="64" rx="8" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="65.0" y="96.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">массив a</text><rect x="120" y="60" width="120" height="64" rx="8" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="180.0" y="96.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">Φ: суммы по кратным</text><rect x="255" y="60" width="60" height="64" rx="8" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="285.0" y="96.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">â</text><rect x="330" y="60" width="120" height="64" rx="8" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="390.0" y="88.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">действие</text><text x="390.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">(произведение, 2^x…)</text><rect x="465" y="60" width="60" height="64" rx="8" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="495.0" y="96.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">ĉ</text><rect x="540" y="60" width="80" height="64" rx="8" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="580.0" y="96.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">Φ⁻¹</text><rect x="640" y="60" width="100" height="64" rx="8" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="690.0" y="96.0" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">ответ c</text><line x1="112" y1="92" x2="118" y2="92" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ar)"/><line x1="242" y1="92" x2="253" y2="92" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ar)"/><line x1="317" y1="92" x2="328" y2="92" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ar)"/><line x1="452" y1="92" x2="463" y2="92" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ar)"/><line x1="527" y1="92" x2="538" y2="92" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ar)"/><line x1="622" y1="92" x2="638" y2="92" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ar)"/><text x="380" y="170" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">Φ(f)[x] = Σ f[y] по y, кратным x;   Φ⁻¹ — те же операции в обратном порядке с минусом</text><text x="380" y="194" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">Φ нужно считать «на месте»: для x по возрастанию  f[x] += f[2x] + f[3x] + …;  обратное: x по убыванию  f[x] −= f[2x] + …</text></svg>