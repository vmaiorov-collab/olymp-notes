<svg role="img" viewbox="0 0 760 214" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="214" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="22">Общая схема: преобразование → поэлементное действие → обратное преобразование</text><rect fill="#1E2836" height="64" rx="8" stroke="#3b4a63" stroke-width="2" width="90" x="20" y="60"></rect><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="65.0" y="96.0">массив a</text><rect fill="#1d4257" height="64" rx="8" stroke="#58c4dd" stroke-width="2" width="120" x="120" y="60"></rect><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="180.0" y="96.0">Φ: суммы по кратным</text><rect fill="#1E2836" height="64" rx="8" stroke="#3b4a63" stroke-width="2" width="60" x="255" y="60"></rect><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="285.0" y="96.0">â</text><rect fill="#53300a" height="64" rx="8" stroke="#ff8c1a" stroke-width="2" width="120" x="330" y="60"></rect><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="390.0" y="88.0">действие</text><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="390.0" y="104.0">(произведение, 2^x…)</text><rect fill="#1E2836" height="64" rx="8" stroke="#3b4a63" stroke-width="2" width="60" x="465" y="60"></rect><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="495.0" y="96.0">ĉ</text><rect fill="#1d4257" height="64" rx="8" stroke="#58c4dd" stroke-width="2" width="80" x="540" y="60"></rect><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="580.0" y="96.0">Φ⁻¹</text><rect fill="#27431f" height="64" rx="8" stroke="#83c167" stroke-width="2" width="100" x="640" y="60"></rect><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="690.0" y="96.0">ответ c</text><line marker-end="url(#ar)" stroke="#9aa4b2" stroke-width="2" x1="112" x2="118" y1="92" y2="92"></line><line marker-end="url(#ar)" stroke="#9aa4b2" stroke-width="2" x1="242" x2="253" y1="92" y2="92"></line><line marker-end="url(#ar)" stroke="#9aa4b2" stroke-width="2" x1="317" x2="328" y1="92" y2="92"></line><line marker-end="url(#ar)" stroke="#9aa4b2" stroke-width="2" x1="452" x2="463" y1="92" y2="92"></line><line marker-end="url(#ar)" stroke="#9aa4b2" stroke-width="2" x1="527" x2="538" y1="92" y2="92"></line><line marker-end="url(#ar)" stroke="#9aa4b2" stroke-width="2" x1="622" x2="638" y1="92" y2="92"></line><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="380" y="170">Φ(f)[x] = Σ f[y] по y, кратным x;   Φ⁻¹ — те же операции в обратном порядке с минусом</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="380" y="194">Φ нужно считать «на месте»: для x по возрастанию  f[x] += f[2x] + f[3x] + …;  обратное: x по убыванию  f[x] −= f[2x] + …</text></svg>