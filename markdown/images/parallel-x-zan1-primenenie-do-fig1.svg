<svg width="760" height="312" viewBox="0 0 760 312" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="312" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Персистентность: обновление копирует только путь, остальное — общие ссылки</text><text x="150" y="48" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">версия i−1</text><line x1="150" y1="80" x2="90" y2="140" stroke="#3b4a63" stroke-width="2"/><line x1="150" y1="80" x2="210" y2="140" stroke="#3b4a63" stroke-width="2"/><line x1="90" y1="140" x2="60" y2="200" stroke="#3b4a63" stroke-width="2"/><line x1="90" y1="140" x2="120" y2="200" stroke="#3b4a63" stroke-width="2"/><line x1="210" y1="140" x2="180" y2="200" stroke="#3b4a63" stroke-width="2"/><line x1="210" y1="140" x2="240" y2="200" stroke="#3b4a63" stroke-width="2"/><circle cx="150" cy="80" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="90" cy="140" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="210" cy="140" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="60" cy="200" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="120" cy="200" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="180" cy="200" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="240" cy="200" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="440" y="48" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">версия i (зелёное — новые вершины)</text><line x1="440" y1="80" x2="380" y2="140" stroke="#83c167" stroke-width="2"/><line x1="440" y1="80" x2="500" y2="140" stroke="#3b4a63" stroke-width="2"/><line x1="380" y1="140" x2="350" y2="200" stroke="#3b4a63" stroke-width="2"/><line x1="380" y1="140" x2="410" y2="200" stroke="#83c167" stroke-width="2"/><line x1="500" y1="140" x2="470" y2="200" stroke="#3b4a63" stroke-width="2"/><line x1="500" y1="140" x2="530" y2="200" stroke="#3b4a63" stroke-width="2"/><circle cx="440" cy="80" r="15" fill="#27431f" stroke="#83c167" stroke-width="2"/><circle cx="380" cy="140" r="15" fill="#27431f" stroke="#83c167" stroke-width="2"/><circle cx="500" cy="140" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="350" cy="200" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="410" cy="200" r="15" fill="#27431f" stroke="#83c167" stroke-width="2"/><circle cx="470" cy="200" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="530" cy="200" r="15" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><line x1="300" y1="130" x2="330" y2="130" stroke="#9aa4b2" stroke-width="2" marker-end="url(#ar)"/><text x="380" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">Новая версия делит с прежней все поддеревья, которые не изменились: O(log n) новых вершин на вставку</text><text x="380" y="292" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">запрос (l, r) = (версия r) − (версия l−1)  —  спуск сразу по двум деревьям</text></svg>