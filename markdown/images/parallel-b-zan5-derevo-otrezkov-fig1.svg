<svg width="760" height="330" viewBox="0 0 760 330" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Ответ для ребёнка через ответ для родителя</text><circle cx="380" cy="70" r="22" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="380" y="74.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">p</text><circle cx="250" cy="170" r="22" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="250" y="174.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">u</text><circle cx="510" cy="170" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><line x1="367" y1="88" x2="262" y2="152" stroke="#3b4a63" stroke-width="3"/><line x1="393" y1="88" x2="498" y2="152" stroke="#3b4a63" stroke-width="3"/><text x="300" y="106" text-anchor="middle" font-size="16" font-weight="400" fill="#ffff00">w</text><ellipse cx="250" cy="225" rx="70" ry="30" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="250" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">поддерево u: sz[u]</text><ellipse cx="515" cy="225" rx="88" ry="30" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="515" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">остальные: n − sz[u]</text><text x="380" y="285" text-anchor="middle" font-size="17" font-weight="400" fill="#ffff00" font-family="ui-monospace,Menlo,monospace">ans[u] = ans[p] − w·sz[u] + w·(n − sz[u])</text><text x="380" y="312" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">вершины поддерева u стали ближе на w, все остальные — дальше на w</text></svg>