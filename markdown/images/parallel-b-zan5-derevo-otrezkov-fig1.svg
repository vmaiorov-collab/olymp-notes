<svg role="img" viewbox="0 0 760 330" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="330" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Ответ для ребёнка через ответ для родителя</text><circle cx="380" cy="70" fill="#1d4257" r="22" stroke="#58c4dd" stroke-width="2"></circle><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="380" y="74.9">p</text><circle cx="250" cy="170" fill="#27431f" r="22" stroke="#83c167" stroke-width="2"></circle><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="250" y="174.9">u</text><circle cx="510" cy="170" fill="#1E2836" r="22" stroke="#3b4a63" stroke-width="2"></circle><line stroke="#3b4a63" stroke-width="3" x1="367" x2="262" y1="88" y2="152"></line><line stroke="#3b4a63" stroke-width="3" x1="393" x2="498" y1="88" y2="152"></line><text fill="#ffff00" font-size="16" font-weight="400" text-anchor="middle" x="300" y="106">w</text><ellipse cx="250" cy="225" fill="#27431f" rx="70" ry="30" stroke="#83c167" stroke-width="2"></ellipse><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="250" y="230">поддерево u: sz[u]</text><ellipse cx="515" cy="225" fill="#53300a" rx="88" ry="30" stroke="#ff8c1a" stroke-width="2"></ellipse><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="515" y="230">остальные: n − sz[u]</text><text fill="#ffff00" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="400" text-anchor="middle" x="380" y="285">ans[u] = ans[p] − w·sz[u] + w·(n − sz[u])</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="312">вершины поддерева u стали ближе на w, все остальные — дальше на w</text></svg>