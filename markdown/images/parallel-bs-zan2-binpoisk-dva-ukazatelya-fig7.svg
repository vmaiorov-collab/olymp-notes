<svg role="img" viewbox="0 0 760 300" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="300" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="380" y="20">Скорость v₁ при x &lt; r, скорость v₂ при x ≥ r; ломаная (0,0) → (r, y) → (1,1)</text><rect fill="none" height="240" stroke="#7c8aa0" stroke-width="1.5" width="300" x="80" y="30"></rect><rect fill="#58c4dd" height="240" opacity=".10" width="135.0" x="80" y="30"></rect><line stroke="#ffff00" stroke-dasharray="5 3" stroke-width="2" x1="215.0" x2="215.0" y1="270" y2="30"></line><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="215.0" y="288">x = r</text><line stroke="#83c167" stroke-width="3" x1="80" x2="215.0" y1="270" y2="121.19999999999999"></line><line stroke="#ff8c1a" stroke-width="3" x1="215.0" x2="380" y1="121.19999999999999" y2="30"></line><circle cx="215.0" cy="121.19999999999999" fill="#4f1f1b" r="6" stroke="#fc6255" stroke-width="2"></circle><text fill="#fc6255" font-size="13" font-weight="400" text-anchor="start" x="229.0" y="113.19999999999999">(r, y)</text><circle cx="80" cy="270" fill="#1E2836" r="5" stroke="#3b4a63" stroke-width="2"></circle><circle cx="380" cy="30" fill="#1E2836" r="5" stroke="#3b4a63" stroke-width="2"></circle><text fill="#58c4dd" font-size="15" font-weight="400" text-anchor="start" x="92" y="64">v₁</text><text fill="#ff8c1a" font-size="15" font-weight="400" text-anchor="end" x="368" y="64">v₂</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="start" x="470" y="80">время(y) =</text><text fill="#83c167" font-size="15" font-weight="400" text-anchor="start" x="470" y="108">√(r² + y²) / v₁</text><text fill="#ff8c1a" font-size="15" font-weight="400" text-anchor="start" x="470" y="134">+ √((1−r)² + (1−y)²) / v₂</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="start" x="470" y="176">обе части выпуклы по y →</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="start" x="470" y="196">сумма выпукла →</text><text fill="#ffff00" font-size="14" font-weight="400" text-anchor="start" x="470" y="216">тернарный поиск по y ∈ [0, 1]</text></svg>