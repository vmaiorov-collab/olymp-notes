<svg width="760" height="300" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="14" fill="#141a24"/><text x="380" y="20" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">Скорость v₁ при x &lt; r, скорость v₂ при x ≥ r; ломаная (0,0) → (r, y) → (1,1)</text><rect x="80" y="30" width="300" height="240" fill="none" stroke="#7c8aa0" stroke-width="1.5"/><rect x="80" y="30" width="135.0" height="240" fill="#58c4dd" opacity=".10"/><line x1="215.0" y1="270" x2="215.0" y2="30" stroke="#ffff00" stroke-width="2" stroke-dasharray="5 3"/><text x="215.0" y="288" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">x = r</text><line x1="80" y1="270" x2="215.0" y2="121.19999999999999" stroke="#83c167" stroke-width="3"/><line x1="215.0" y1="121.19999999999999" x2="380" y2="30" stroke="#ff8c1a" stroke-width="3"/><circle cx="215.0" cy="121.19999999999999" r="6" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="229.0" y="113.19999999999999" text-anchor="start" font-size="13" font-weight="400" fill="#fc6255">(r, y)</text><circle cx="80" cy="270" r="5" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><circle cx="380" cy="30" r="5" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="92" y="64" text-anchor="start" font-size="15" font-weight="400" fill="#58c4dd">v₁</text><text x="368" y="64" text-anchor="end" font-size="15" font-weight="400" fill="#ff8c1a">v₂</text><text x="470" y="80" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">время(y) =</text><text x="470" y="108" text-anchor="start" font-size="15" font-weight="400" fill="#83c167">√(r² + y²) / v₁</text><text x="470" y="134" text-anchor="start" font-size="15" font-weight="400" fill="#ff8c1a">+ √((1−r)² + (1−y)²) / v₂</text><text x="470" y="176" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">обе части выпуклы по y →</text><text x="470" y="196" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">сумма выпукла →</text><text x="470" y="216" text-anchor="start" font-size="14" font-weight="400" fill="#ffff00">тернарный поиск по y ∈ [0, 1]</text></svg>