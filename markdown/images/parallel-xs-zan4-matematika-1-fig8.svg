0" text-anchor="start" x="300" y="152">поэтому 15·5 = 75 повторно не записывается</text><text fill="#ff8c1a" font-size="14" font-weight="400" text-anchor="start" x="300" y="204">условие остановки внутреннего цикла: x &gt; lp(i)</text></svg>