<svg width="760" height="260" viewBox="0 0 760 260" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="260" rx="14" fill="#141a24"/><text x="380" y="26" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Ограничение потока через вершину — раздвоение вершины</text><circle cx="110" cy="120" r="24" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="110" y="126.3" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">x</text><text x="110" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">вершина с ограничением c</text><line x1="150" y1="120" x2="230" y2="120" stroke="#ffff00" stroke-width="3" marker-end="url(#ar)"/><circle cx="330" cy="120" r="20" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="330" y="125.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">x₁</text><circle cx="520" cy="120" r="20" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="520" y="125.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">x₂</text><line x1="352" y1="120" x2="496" y2="120" stroke="#ff8c1a" stroke-width="4" marker-end="url(#ar)"/><text x="424" y="106" text-anchor="middle" font-size="14" font-weight="400" fill="#ff8c1a">ёмкость c</text><line x1="250" y1="75" x2="312" y2="106.5" stroke="#3b4a63" stroke-width="2.5" marker-end="url(#ar)"/><line x1="540" y1="106.5" x2="610" y2="75" stroke="#3b4a63" stroke-width="2.5" marker-end="url(#ar)"/><line x1="250" y1="165" x2="312" y2="133.5" stroke="#3b4a63" stroke-width="2.5" marker-end="url(#ar)"/><line x1="540" y1="133.5" x2="610" y2="165" stroke="#3b4a63" stroke-width="2.5" marker-end="url(#ar)"/><text x="280" y="62" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">входящие</text><text x="590" y="62" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">исходящие</text><text x="380" y="215" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">все входящие рёбра идут в x₁, все исходящие выходят из x₂; новое ребро x₁→x₂ ограничивает поток</text><text x="380" y="240" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">работает для ориентированного графа; неориентированное ребро сначала заменяют двумя ориентированными</text></svg>