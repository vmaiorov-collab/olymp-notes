<svg role="img" viewbox="0 0 760 304" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="304" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">n = 4, K = 1, t = 1:  f(w) = w + ⌈4/w⌉²</text><rect fill="#1d4257" height="153" rx="4" stroke="#58c4dd" stroke-width="1.8" width="80" x="120" y="57"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="160" y="49">17</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="160" y="232">w=1</text><rect fill="#1d4257" height="54" rx="4" stroke="#58c4dd" stroke-width="1.8" width="80" x="260" y="156"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="300" y="148">6</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="300" y="232">w=2</text><rect fill="#1d4257" height="63" rx="4" stroke="#58c4dd" stroke-width="1.8" width="80" x="400" y="147"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="440" y="139">7</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="440" y="232">w=3</text><rect fill="#27431f" height="45" rx="4" stroke="#83c167" stroke-width="1.8" width="80" x="540" y="165"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="580" y="157">5</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="580" y="232">w=4</text><text fill="#fc6255" font-size="14" font-weight="400" text-anchor="middle" x="380" y="262">17 → 6 → 7 → 5: после подъёма снова спуск — функция не унимодальна</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="284">тернарный поиск по w может остановиться на 6, хотя минимум 5</text></svg>