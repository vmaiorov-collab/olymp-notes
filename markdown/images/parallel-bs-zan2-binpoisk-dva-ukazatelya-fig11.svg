<svg width="760" height="304" viewBox="0 0 760 304" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="304" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">n = 4, K = 1, t = 1:  f(w) = w + ⌈4/w⌉²</text><rect x="120" y="57" width="80" height="153" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.8"/><text x="160" y="49" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">17</text><text x="160" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">w=1</text><rect x="260" y="156" width="80" height="54" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.8"/><text x="300" y="148" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">6</text><text x="300" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">w=2</text><rect x="400" y="147" width="80" height="63" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.8"/><text x="440" y="139" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">7</text><text x="440" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">w=3</text><rect x="540" y="165" width="80" height="45" rx="4" fill="#27431f" stroke="#83c167" stroke-width="1.8"/><text x="580" y="157" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">5</text><text x="580" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">w=4</text><text x="380" y="262" text-anchor="middle" font-size="14" font-weight="400" fill="#fc6255">17 → 6 → 7 → 5: после подъёма снова спуск — функция не унимодальна</text><text x="380" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">тернарный поиск по w может остановиться на 6, 