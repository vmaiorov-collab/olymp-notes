<svg width="760" height="246" viewBox="0 0 760 246" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="246" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Одна ошибка в позиции i: совпал префикс, потом одна буква, потом совпал суффикс</text><text x="24" y="70" text-anchor="start" font-size="14" font-weight="400" fill="#9aa4b2">P</text><rect x="70" y="50" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="95.0" y="72.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">a</text><rect x="126" y="50" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="151.0" y="72.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">b</text><rect x="182" y="50" width="50" height="34" rx="6" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="207.0" y="72.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">c</text><rect x="238" y="50" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="263.0" y="72.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">a</text><rect x="294" y="50" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="319.0" y="72.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">b</text><text x="24" y="140" text-anchor="start" font-size="14" font-weight="400" fill="#9aa4b2">T[i..]</text><rect x="70" y="120" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="95.0" y="142.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">a</text><rect x="126" y="120" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="151.0" y="142.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">b</text><rect x="182" y="120" width="50" height="34" rx="6" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="207.0" y="142.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">d</text><rect x="238" y="120" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="263.0" y="142.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">a</text><rect x="294" y="120" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="319.0" y="142.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">b</text><line x1="70" y1="98" x2="176" y2="98" stroke="#83c167" stroke-width="2"/><text x="123" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="#83c167">pre[i]</text><line x1="244" y1="98" x2="344" y2="98" stroke="#83c167" stroke-width="2"/><text x="291" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="#83c167">suf[i+m−1]</text><text x="480" y="76" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">pre[i]  — длина общего префикса P и T[i..]  (Z-функция P#T)</text><text x="480" y="102" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">suf[j]  — длина общего суффикса P и T[..j]  (Z-функция от</text><text x="480" y="122" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">развёрнутых строк)</text><text x="380" y="200" text-anchor="middle" font-size="16" font-weight="400" fill="#ffff00">почти вхождение  ⇔  pre[i] + suf[i+m−1] ≥ m − 1</text><text x="380" y="226" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">если сумма ≥ m, то это точное вхождение — тоже подходит</text></svg>