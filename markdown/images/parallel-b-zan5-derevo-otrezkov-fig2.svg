<svg role="img" viewbox="0 0 760 270" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="270" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Покраска: пересекающиеся отрезки не нужны, достаточно вложенных</text><rect fill="#1d4257" height="40" rx="6" stroke="#58c4dd" stroke-width="2" width="110" x="80" y="140"></rect><rect fill="#53300a" height="40" rx="6" stroke="#ff8c1a" stroke-width="2" width="110" x="200" y="140"></rect><rect fill="#27431f" height="40" rx="6" stroke="#83c167" stroke-width="2" width="110" x="320" y="140"></rect><rect fill="#53300a" height="40" rx="6" stroke="#ff8c1a" stroke-width="2" width="110" x="440" y="140"></rect><rect fill="#1d4257" height="40" rx="6" stroke="#58c4dd" stroke-width="2" width="110" x="560" y="140"></rect><rect fill="#1d4257" height="26" rx="6" stroke="#58c4dd" stroke-width="2" width="608" x="76" y="62"></rect><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="380" y="80">1) всё в синий</text><rect fill="#53300a" height="26" rx="6" stroke="#ff8c1a" stroke-width="2" width="368" x="196" y="94"></rect><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="380" y="112">2) середину в оранжевый</text><rect fill="#27431f" height="8" rx="3" stroke="#83c167" stroke-width="2" width="128" x="316" y="126"></rect><text fill="#83c167" font-size="13" font-weight="400" text-anchor="middle" x="380" y="202">3) центр в зелёный</text><text fill="#9aa4b2" font-size="14" font-weight="400" text-anchor="middle" x="380" y="250">красим сверху вниз: сначала большой отрезок, потом вложенные в него</text></svg>