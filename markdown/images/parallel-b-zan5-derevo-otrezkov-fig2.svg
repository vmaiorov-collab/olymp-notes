<svg width="760" height="270" viewBox="0 0 760 270" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="270" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Покраска: пересекающиеся отрезки не нужны, достаточно вложенных</text><rect x="80" y="140" width="110" height="40" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><rect x="200" y="140" width="110" height="40" rx="6" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><rect x="320" y="140" width="110" height="40" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><rect x="440" y="140" width="110" height="40" rx="6" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><rect x="560" y="140" width="110" height="40" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><rect x="76" y="62" width="608" height="26" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="380" y="80" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">1) всё в синий</text><rect x="196" y="94" width="368" height="26" rx="6" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="380" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">2) середину в оранжевый</text><rect x="316" y="126" width="128" height="8" rx="3" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="380" y="202" text-anchor="middle" font-size="13" font-weight="400" fill="#83c167">3) центр в зелёный</text><text x="380" y="250" text-anchor="middle" font-size="14" font-weight="400" fill="#9aa4b2">красим сверху вниз: сначала большой отрезок, потом вложенные в него</text></svg>