<svg width="760" height="322" viewBox="0 0 760 322" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="322" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Одновременный обход двух боров: бор запроса T и автомат Ахо—Корасик по набору</text><circle cx="130" cy="70" r="20" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><circle cx="70" cy="140" r="20" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="190" cy="140" r="20" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><circle cx="70" cy="210" r="20" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><line x1="130" y1="90" x2="78" y2="124" stroke="#3b4a63" stroke-width="2"/><line x1="130" y1="90" x2="182" y2="124" stroke="#3b4a63" stroke-width="2"/><line x1="70" y1="160" x2="70" y2="190" stroke="#3b4a63" stroke-width="2"/><text x="104" y="112" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">a</text><text x="160" y="112" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">b</text><text x="58" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">b</text><text x="130" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">бор T (в нём идём DFS)</text><circle cx="560" cy="70" r="20" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><circle cx="500" cy="140" r="20" fill="#27431f" stroke="#83c167" stroke-width="2"/><circle cx="620" cy="140" r="20" fill="#27431f" stroke="#83c167" stroke-width="2"/><circle cx="500" cy="210" r="20" fill="#27431f" stroke="#83c167" stroke-width="2"/><line x1="560" y1="90" x2="508" y2="124" stroke="#3b4a63" stroke-width="2"/><line x1="560" y1="90" x2="612" y2="124" stroke="#3b4a63" stroke-width="2"/><line x1="500" y1="160" x2="500" y2="190" stroke="#3b4a63" stroke-width="2"/><text x="560" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">автомат: вершина v по ходу DFS</text><line x1="150" y1="140" x2="480" y2="140" stroke="#ffff00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="315" y="128" text-anchor="middle" font-size="12" font-weight="400" fill="#ffff00">state[u] = переход(state[parent], буква)</text><text x="380" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">вершину автомата запоминаем в каждой вершине T — при возврате вверх она не теряется</text><text x="380" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">ответ += cnt[state], где cnt[v] = терминальные на пути по суффиксным ссылкам</text></svg>