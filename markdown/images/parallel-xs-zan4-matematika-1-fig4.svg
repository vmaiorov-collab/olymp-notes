<svg role="img" viewbox="0 0 760 322" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="322" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Одновременный обход двух боров: бор запроса T и автомат Ахо—Корасик по набору</text><circle cx="130" cy="70" fill="#1E2836" r="20" stroke="#3b4a63" stroke-width="2"></circle><circle cx="70" cy="140" fill="#1d4257" r="20" stroke="#58c4dd" stroke-width="2"></circle><circle cx="190" cy="140" fill="#1d4257" r="20" stroke="#58c4dd" stroke-width="2"></circle><circle cx="70" cy="210" fill="#1d4257" r="20" stroke="#58c4dd" stroke-width="2"></circle><line stroke="#3b4a63" stroke-width="2" x1="130" x2="78" y1="90" y2="124"></line><line stroke="#3b4a63" stroke-width="2" x1="130" x2="182" y1="90" y2="124"></line><line stroke="#3b4a63" stroke-width="2" x1="70" x2="70" y1="160" y2="190"></line><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="104" y="112">a</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="160" y="112">b</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="58" y="178">b</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="130" y="250">бор T (в нём идём DFS)</text><circle cx="560" cy="70" fill="#1E2836" r="20" stroke="#3b4a63" stroke-width="2"></circle><circle cx="500" cy="140" fill="#27431f" r="20" stroke="#83c167" stroke-width="2"></circle><circle cx="620" cy="140" fill="#27431f" r="20" stroke="#83c167" stroke-width="2"></circle><circle cx="500" cy="210" fill="#27431f" r="20" stroke="#83c167" stroke-width="2"></circle><line stroke="#3b4a63" stroke-width="2" x1="560" x2="508" y1="90" y2="124"></line><line stroke="#3b4a63" stroke-width="2" x1="560" x2="612" y1="90" y2="124"></line><line stroke="#3b4a63" stroke-width="2" x1="500" x2="500" y1="160" y2="190"></line><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="560" y="250">автомат: вершина v по ходу DFS</text><line marker-end="url(#ar)" stroke="#ffff00" stroke-dasharray="5 4" stroke-width="1.5" x1="150" x2="480" y1="140" y2="140"></line><text fill="#ffff00" font-size="12" font-weight="400" text-anchor="middle" x="315" y="128">state[u] = переход(state[parent], буква)</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="280">вершину автомата запоминаем в каждой вершине T — при возврате вверх она не теряется</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="302">ответ += cnt[state], где cnt[v] = терминальные на пути по суффиксным ссылкам</text></svg>