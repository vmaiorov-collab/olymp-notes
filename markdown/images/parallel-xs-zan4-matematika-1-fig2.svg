="#3b4a63" stroke-width="1.5" width="60" x="290" y="112"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="320.0" y="134.6">0</text><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="60" x="360" y="112"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="390.0" y="134.6">3</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="start" x="24" y="196">b = (…) xor 2</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="60" x="150" y="174"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="180.0" y="196.6">3</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="60" x="220" y="174"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="250.0" y="196.6">0</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="60" x="290" y="174"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="320.0" y="196.6">2</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="60" x="360" y="174"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="390.0" y="196.6">1</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="start" x="480" y="74">c[i] = a[i] xor a[i+1 mod n]:</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="start" x="480" y="98">[2, 3, 2, 3] → циклически сдвинутый</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="start" x="480" y="192">d[i] = b[i] xor b[i+1 mod n]:</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="start" x="480" y="216">[3, 2, 3, 2]</text><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="380" y="262">ищем d как подстроку cc = c+c; позиция входа даёт k, а x = a[k] xor b[0]</text></svg>