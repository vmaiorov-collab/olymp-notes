roke="#3b4a63" stroke-width="1.5"/><text x="320.0" y="134.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">0</text><rect x="360" y="112" width="60" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="390.0" y="134.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">3</text><text x="24" y="196" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">b = (…) xor 2</text><rect x="150" y="174" width="60" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="180.0" y="196.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">3</text><rect x="220" y="174" width="60" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="250.0" y="196.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">0</text><rect x="290" y="174" width="60" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="320.0" y="196.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">2</text><rect x="360" y="174" width="60" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="390.0" y="196.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">1</text><text x="480" y="74" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">c[i] = a[i] xor a[i+1 mod n]:</text><text x="480" y="98" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">[2, 3, 2, 3] → циклически сдвинутый</text><text x="480" y="192" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">d[i] = b[i] xor b[i+1 mod n]:</text><text x="480" y="216" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">[3, 2, 3, 2]</text><text x="380" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">ищем d как подстроку cc = c+c; позиция входа даёт k, а x = a[k] xor b[0]</text></svg>