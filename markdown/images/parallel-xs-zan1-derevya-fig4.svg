<svg width="760" height="270" viewBox="0 0 760 270" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="270" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Вершина u и «мешки» уже просмотренных поддеревьев: у всех в мешке один LCA с u</text><line x1="90" y1="70" x2="230" y2="120" stroke="#3b4a63" stroke-width="3"/><line x1="230" y1="120" x2="370" y2="170" stroke="#3b4a63" stroke-width="3"/><line x1="370" y1="170" x2="510" y2="220" stroke="#3b4a63" stroke-width="3"/><circle cx="90" cy="70" r="20" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="90" y="74.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">r</text><circle cx="230" cy="120" r="20" fill="#3a2858" stroke="#c78bff" stroke-width="2"/><text x="230" y="124.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">a₁</text><circle cx="370" cy="170" r="20" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="370" y="174.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">a₂</text><circle cx="510" cy="220" r="20" fill="#4d4d00" stroke="#ffff00" stroke-width="2"/><text x="510" y="224.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">u</text><ellipse cx="15" cy="98" rx="48" ry="24" fill="#53300a" stroke="#ff8c1a" stroke-width="2" stroke-dasharray="5 4"/><text x="15" y="103" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">мешок</text><line x1="76" y1="82" x2="45" y2="84" stroke="#ff8c1a" stroke-width="2"/><ellipse cx="155" cy="148" rx="48" ry="24" fill="#3a2858" stroke="#c78bff" stroke-width="2" stroke-dasharray="5 4"/><text x="155" y="153" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">мешок</text><line x1="216" y1="132" x2="185" y2="134" stroke="#c78bff" stroke-width="2"/><ellipse cx="295" cy="198" rx="48" ry="24" fill="#27431f" stroke="#83c167" stroke-width="2" stroke-dasharray="5 4"/><text x="295" y="203" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">мешок</text><line x1="356" y1="182" x2="325" y2="184" stroke="#83c167" stroke-width="2"/><text x="610" y="76" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">LCA(u, x) для x из мешка</text><text x="610" y="98" text-anchor="start" font-size="13" font-weight="400" fill="#ff8c1a">верхнего = корень</text><text x="610" y="130" text-anchor="start" font-size="13" font-weight="400" fill="#c78bff">среднего = a₁</text><text x="610" y="162" text-anchor="start" font-size="13" font-weight="400" fill="#83c167">нижнего = a₂</text><text x="610" y="204" text-anchor="start" font-size="13" font-weight="400" fill="#ffff00">Каждый мешок — множество СНМ</text><text x="610" y="224" text-anchor="start" font-size="13" font-weight="400" fill="#ffff00">с представителем-предком</text></svg>