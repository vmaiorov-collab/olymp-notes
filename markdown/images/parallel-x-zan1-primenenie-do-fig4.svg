a63" stroke-width="2"></circle><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="450" y="235">mn</text><circle cx="610" cy="230" fill="#1E2836" r="22" stroke="#3b4a63" stroke-width="2"></circle><text fill="#dfe7f1" font-size="12" font-weight="400" text-anchor="middle" x="610" y="235">mn</text><text fill="#83c167" font-size="13" font-weight="400" text-anchor="start" x="268" y="143">mod = +3</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="280">mn[v] = min(mn[левый], mn[правый]) + mod[v];  get(v) возвращает ответ без модификаторов предков</text><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="380" y="302">годится, когда операции перестановочны (сложение); присваивание так не сделать</text></svg>