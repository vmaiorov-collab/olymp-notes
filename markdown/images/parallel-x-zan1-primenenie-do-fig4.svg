<svg width="760" height="322" viewBox="0 0 760 322" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="322" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Без push: у вершины свой модификатор, предков он не касается</text><line x1="380" y1="70" x2="230" y2="150" stroke="#3b4a63" stroke-width="2"/><line x1="380" y1="70" x2="530" y2="150" stroke="#3b4a63" stroke-width="2"/><line x1="230" y1="150" x2="150" y2="230" stroke="#3b4a63" stroke-width="2"/><line x1="230" y1="150" x2="310" y2="230" stroke="#3b4a63" stroke-width="2"/><line x1="530" y1="150" x2="450" y2="230" stroke="#3b4a63" stroke-width="2"/><line x1="530" y1="150" x2="610" y2="230" stroke="#3b4a63" stroke-width="2"/><circle cx="380" cy="70" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="380" y="75" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">mn</text><circle cx="230" cy="150" r="22" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="230" y="155" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">mn</text><circle cx="530" cy="150" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="530" y="155" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">mn</text><circle cx="150" cy="230" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="150" y="235" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">mn</text><circle cx="310" cy="230" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="310" y="235" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">mn</text><circle cx="450" cy="230" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="450" y="235" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">mn</text><circle cx="610" cy="230" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="610" y="235" text-anchor="middle" font-size="12" font-weight="400" fill="#dfe7f1">mn</text><text x="268" y="143" text-anchor="start" font-size="13" font-weight="400" fill="#83c167">mod = +3</text><text x="380" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">mn[v] = min(mn[левый], mn[правый]) + mod[v];  get(v) возвращает ответ без модификаторов предков</text><text x="380" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">годится, когда операции перестановочны (сложение); присваивание так не сделать</text></svg>