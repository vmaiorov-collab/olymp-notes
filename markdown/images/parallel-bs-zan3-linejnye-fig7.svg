<svg width="760" height="290" viewBox="0 0 760 290" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="290" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Наибольший прямоугольник в гистограмме: [2, 1, 5, 6, 2, 3]</text><rect x="100" y="164" width="84" height="56" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="142.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">2</text><rect x="190" y="192" width="84" height="28" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="232.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">1</text><rect x="280" y="80" width="84" height="140" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="322.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">5</text><rect x="370" y="52" width="84" height="168" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="412.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">6</text><rect x="460" y="164" width="84" height="56" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="502.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">2</text><rect x="550" y="136" width="84" height="84" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="592.0" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">3</text><rect x="280" y="80" width="174" height="140" fill="none" stroke="#ffff00" stroke-width="3" stroke-dasharray="6 4"/><text x="367" y="72" text-anchor="middle" font-size="14" font-weight="400" fill="#ffff00">высота 5 × ширина 2 = 10</text><text x="380" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">для столбца i: L — ближайший слева ниже, R — ближайший справа ниже; ширина = R − L − 1</text></svg>