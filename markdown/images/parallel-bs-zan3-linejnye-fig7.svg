<svg role="img" viewbox="0 0 760 290" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="290" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Наибольший прямоугольник в гистограмме: [2, 1, 5, 6, 2, 3]</text><rect fill="#1E2836" height="56" stroke="#3b4a63" stroke-width="2" width="84" x="100" y="164"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="142.0" y="238">2</text><rect fill="#1E2836" height="28" stroke="#3b4a63" stroke-width="2" width="84" x="190" y="192"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="232.0" y="238">1</text><rect fill="#53300a" height="140" stroke="#ff8c1a" stroke-width="2" width="84" x="280" y="80"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="322.0" y="238">5</text><rect fill="#53300a" height="168" stroke="#ff8c1a" stroke-width="2" width="84" x="370" y="52"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="412.0" y="238">6</text><rect fill="#1E2836" height="56" stroke="#3b4a63" stroke-width="2" width="84" x="460" y="164"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="502.0" y="238">2</text><rect fill="#1E2836" height="84" stroke="#3b4a63" stroke-width="2" width="84" x="550" y="136"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="592.0" y="238">3</text><rect fill="none" height="140" stroke="#ffff00" stroke-dasharray="6 4" stroke-width="3" width="174" x="280" y="80"></rect><text fill="#ffff00" font-size="14" font-weight="400" text-anchor="middle" x="367" y="72">высота 5 × ширина 2 = 10</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="270">для столбца i: L — ближайший слева ниже, R — ближайший справа ниже; ширина = R − L − 1</text></svg>