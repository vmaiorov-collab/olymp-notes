<svg width="760" height="326" viewBox="0 0 760 326" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="326" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Игра с xor: смотрим на старший бит, считаем cnt₁ и cnt₀</text><circle cx="380" cy="62" r="22" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="380" y="66.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">бит L</text><circle cx="220" cy="140" r="22" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="220" y="144.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">0</text><circle cx="540" cy="140" r="22" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="540" y="144.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">1</text><line x1="380" y1="84" x2="236" y2="124" stroke="#3b4a63" stroke-width="2"/><line x1="380" y1="84" x2="524" y2="124" stroke="#3b4a63" stroke-width="2"/><text x="220" y="188" text-anchor="middle" font-size="13" font-weight="400" fill="#58c4dd">cnt₀ чётно</text><text x="540" y="188" text-anchor="middle" font-size="13" font-weight="400" fill="#ff8c1a">cnt₁ чётно</text><text x="380" y="232" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">чётно: Боб отвечает «парой» → бит L в ответе не появится;</text><text x="380" y="254" text-anchor="middle" font-size="14" font-weight="400" fill="#ffff00">две независимые игры, ответ — max из двух</text><text x="380" y="284" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">нечётно: ровно одна пара из разных половин; Алиса берёт x,</text><text x="380" y="306" text-anchor="middle" font-size="14" font-weight="400" fill="#ffff00">Боб берёт y из другой половины с минимальным x xor y; ответ — max по x</text></svg>