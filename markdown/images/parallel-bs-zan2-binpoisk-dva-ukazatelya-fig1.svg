<svg width="760" height="300" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Угадываем число от 1 до 100: каждый вопрос вдвое сужает область</text><rect x="80" y="48" width="600" height="22" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.5"/><text x="60" y="64" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">0</text><text x="690" y="64" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">100</text><rect x="80" y="78" width="300" height="22" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.5"/><text x="60" y="94" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">1</text><text x="390" y="94" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">50</text><rect x="80" y="108" width="150" height="22" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.5"/><text x="60" y="124" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">2</text><text x="240" y="124" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">25</text><rect x="80" y="138" width="78" height="22" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.5"/><text x="60" y="154" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">3</text><text x="168" y="154" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">13</text><rect x="80" y="168" width="42" height="22" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.5"/><text x="60" y="184" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">4</text><text x="132" y="184" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">7</text><rect x="80" y="198" width="24" height="22" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.5"/><text x="60" y="214" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">5</text><text x="114" y="214" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">4</text><rect x="80" y="228" width="12" height="22" rx="4" fill="#1d4257" stroke="#58c4dd" stroke-width="1.5"/><text x="60" y="244" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">6</text><text x="102" y="244" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">2</text><rect x="80" y="258" width="6" height="22" rx="4" fill="#27431f" stroke="#83c167" stroke-width="1.5"/><text x="60" y="274" text-anchor="end" font-size="12" font-weight="400" fill="#9aa4b2">7</text><text x="96" y="274" text-anchor="start" font-size="13" font-weight="400" fill="#dfe7f1">1</text><text x="560" y="110" text-anchor="start" font-size="14" font-weight="400" fill="#ffff00">2⁶ = 64 &lt; 100 ≤ 2⁷ = 128</text><text x="560" y="140" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">значит нужно 7 вопросов:</text><text x="560" y="164" text-anchor="start" font-size="16" font-weight="700" fill="#83c167">⌈log₂ 100⌉ = 7</text><text x="560" y="200" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">основание логарифма в</text><text x="560" y="218" text-anchor="start" font-size="13" font-weight="400" fill="#9aa4b2">асимптотике не пишут</text></svg>