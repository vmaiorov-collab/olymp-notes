<svg role="img" viewbox="0 0 760 300" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="300" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Угадываем число от 1 до 100: каждый вопрос вдвое сужает область</text><rect fill="#1d4257" height="22" rx="4" stroke="#58c4dd" stroke-width="1.5" width="600" x="80" y="48"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="64">0</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="690" y="64">100</text><rect fill="#1d4257" height="22" rx="4" stroke="#58c4dd" stroke-width="1.5" width="300" x="80" y="78"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="94">1</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="390" y="94">50</text><rect fill="#1d4257" height="22" rx="4" stroke="#58c4dd" stroke-width="1.5" width="150" x="80" y="108"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="124">2</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="240" y="124">25</text><rect fill="#1d4257" height="22" rx="4" stroke="#58c4dd" stroke-width="1.5" width="78" x="80" y="138"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="154">3</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="168" y="154">13</text><rect fill="#1d4257" height="22" rx="4" stroke="#58c4dd" stroke-width="1.5" width="42" x="80" y="168"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="184">4</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="132" y="184">7</text><rect fill="#1d4257" height="22" rx="4" stroke="#58c4dd" stroke-width="1.5" width="24" x="80" y="198"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="214">5</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="114" y="214">4</text><rect fill="#1d4257" height="22" rx="4" stroke="#58c4dd" stroke-width="1.5" width="12" x="80" y="228"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="244">6</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="102" y="244">2</text><rect fill="#27431f" height="22" rx="4" stroke="#83c167" stroke-width="1.5" width="6" x="80" y="258"></rect><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="end" x="60" y="274">7</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="start" x="96" y="274">1</text><text fill="#ffff00" font-size="14" font-weight="400" text-anchor="start" x="560" y="110">2⁶ = 64 &lt; 100 ≤ 2⁷ = 128</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="start" x="560" y="140">значит нужно 7 вопросов:</text><text fill="#83c167" font-size="16" font-weight="700" text-anchor="start" x="560" y="164">⌈log₂ 100⌉ = 7</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="start" x="560" y="200">основание логарифма в</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="start" x="560" y="218">асимптотике не пишут</text></svg>