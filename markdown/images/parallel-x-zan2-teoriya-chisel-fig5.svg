<svg width="760" height="310" viewBox="0 0 760 310" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="310" rx="14" fill="#141a24"/><text x="380" y="22" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Прямая с наклоном 3/5 — строка из букв R (пересекли вертикаль) и U (пересекли горизонталь)</text><line x1="120" y1="220" x2="120" y2="40" stroke="#3b4a63" stroke-width="1"/><line x1="220" y1="220" x2="220" y2="40" stroke="#3b4a63" stroke-width="1"/><line x1="320" y1="220" x2="320" y2="40" stroke="#3b4a63" stroke-width="1"/><line x1="420" y1="220" x2="420" y2="40" stroke="#3b4a63" stroke-width="1"/><line x1="520" y1="220" x2="520" y2="40" stroke="#3b4a63" stroke-width="1"/><line x1="620" y1="220" x2="620" y2="40" stroke="#3b4a63" stroke-width="1"/><line x1="120" y1="220" x2="620" y2="220" stroke="#3b4a63" stroke-width="1"/><line x1="120" y1="160" x2="620" y2="160" stroke="#3b4a63" stroke-width="1"/><line x1="120" y1="100" x2="620" y2="100" stroke="#3b4a63" stroke-width="1"/><line x1="120" y1="40" x2="620" y2="40" stroke="#3b4a63" stroke-width="1"/><line x1="120" y1="220" x2="620" y2="40" stroke="#ffff00" stroke-width="3"/><text x="380" y="262" text-anchor="middle" font-size="18" font-weight="400" fill="#83c167" font-family="ui-monospace,Menlo,monospace">строка:  R U R R U R U R</text><text x="380" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">равномерность: на любых двух отрезках одинаковой длины число букв R отличается не больше чем на 1</text></svg>