<svg role="img" viewbox="0 0 760 310" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="310" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="22">Прямая с наклоном 3/5 — строка из букв R (пересекли вертикаль) и U (пересекли горизонталь)</text><line stroke="#3b4a63" stroke-width="1" x1="120" x2="120" y1="220" y2="40"></line><line stroke="#3b4a63" stroke-width="1" x1="220" x2="220" y1="220" y2="40"></line><line stroke="#3b4a63" stroke-width="1" x1="320" x2="320" y1="220" y2="40"></line><line stroke="#3b4a63" stroke-width="1" x1="420" x2="420" y1="220" y2="40"></line><line stroke="#3b4a63" stroke-width="1" x1="520" x2="520" y1="220" y2="40"></line><line stroke="#3b4a63" stroke-width="1" x1="620" x2="620" y1="220" y2="40"></line><line stroke="#3b4a63" stroke-width="1" x1="120" x2="620" y1="220" y2="220"></line><line stroke="#3b4a63" stroke-width="1" x1="120" x2="620" y1="160" y2="160"></line><line stroke="#3b4a63" stroke-width="1" x1="120" x2="620" y1="100" y2="100"></line><line stroke="#3b4a63" stroke-width="1" x1="120" x2="620" y1="40" y2="40"></line><line stroke="#ffff00" stroke-width="3" x1="120" x2="620" y1="220" y2="40"></line><text fill="#83c167" font-family="ui-monospace,Menlo,monospace" font-size="18" font-weight="400" text-anchor="middle" x="380" y="262">строка:  R U R R U R U R</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="290">равномерность: на любых двух отрезках одинаковой длины число букв R отличается не больше чем на 1</text></svg>