<svg role="img" viewbox="0 0 760 280" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="280" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Плато ломает тернарный поиск</text><line stroke="#7c8aa0" stroke-width="1.5" x1="50" x2="710" y1="190" y2="190"></line><polyline fill="none" points="60.0,170.0 200.0,90.0 330.0,90.0 460.0,90.0 560.0,40.0 680.0,170.0" stroke="#58c4dd" stroke-width="3"></polyline><line stroke="#ffff00" stroke-dasharray="4 3" stroke-width="1.5" x1="250" x2="250" y1="190" y2="90"></line><circle cx="250" cy="90" fill="#4d4d00" r="5" stroke="#ffff00" stroke-width="2"></circle><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="250" y="208">m₁</text><line stroke="#ffff00" stroke-dasharray="4 3" stroke-width="1.5" x1="400" x2="400" y1="190" y2="90"></line><circle cx="400" cy="90" fill="#4d4d00" r="5" stroke="#ffff00" stroke-width="2"></circle><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="400" y="208">m₂</text><circle cx="560" cy="40" fill="#27431f" r="6" stroke="#83c167" stroke-width="2"></circle><text fill="#83c167" font-size="13" font-weight="400" text-anchor="middle" x="560" y="28">максимум</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="236">f(m₁) = f(m₂): по значениям не понять, где максимум — слева или справа от плато</text><text fill="#fc6255" font-size="13" font-weight="400" text-anchor="middle" x="380" y="258">если сдвинуть любую границу, можно потерять точку максимума</text></svg>