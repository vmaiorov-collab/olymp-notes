<svg width="760" height="280" viewBox="0 0 760 280" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="280" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Плато ломает тернарный поиск</text><line x1="50" y1="190" x2="710" y2="190" stroke="#7c8aa0" stroke-width="1.5"/><polyline points="60.0,170.0 200.0,90.0 330.0,90.0 460.0,90.0 560.0,40.0 680.0,170.0" fill="none" stroke="#58c4dd" stroke-width="3"/><line x1="250" y1="190" x2="250" y2="90" stroke="#ffff00" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="250" cy="90" r="5" fill="#4d4d00" stroke="#ffff00" stroke-width="2"/><text x="250" y="208" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">m₁</text><line x1="400" y1="190" x2="400" y2="90" stroke="#ffff00" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="400" cy="90" r="5" fill="#4d4d00" stroke="#ffff00" stroke-width="2"/><text x="400" y="208" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">m₂</text><circle cx="560" cy="40" r="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="560" y="28" text-anchor="middle" font-size="13" font-weight="400" fill="#83c167">максимум</text><text x="380" y="236" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">f(m₁) = f(m₂): по значениям не понять, где максимум — слева или справа от плато</text><text x="380" y="258" text-anchor="middle" font-size="13" font-weight="400" fill="#fc6255">если сдвинуть любую границу, можно потерять точку максимума</text></svg>