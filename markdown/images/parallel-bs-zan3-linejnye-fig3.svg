<svg width="760" height="292" viewBox="0 0 760 292" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="292" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Одна координата — три вида событий; порядок: открыть, запрос, закрыть</text><rect x="80" y="70" width="190" height="54" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="175.0" y="101.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">открыть отрезок (+1)</text><text x="175" y="150" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">приоритет 0</text><rect x="310" y="70" width="190" height="54" rx="6" fill="#4d4d00" stroke="#ffff00" stroke-width="2"/><text x="405.0" y="101.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">запрос в точке x</text><text x="405" y="150" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">приоритет 1</text><rect x="540" y="70" width="190" height="54" rx="6" fill="#4f1f1b" stroke="#fc6255" stroke-width="2"/><text x="635.0" y="101.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">закрыть отрезок (−1)</text><text x="635" y="150" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">приоритет 2</text><text x="380" y="200" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">отрезок [l, r] включает обе границы: поэтому при равных координатах</text><text x="380" y="224" text-anchor="middle" font-size="14" font-weight="400" fill="#ffff00">сначала открываем, потом отвечаем, и только потом закрываем</text><text x="380" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">сортировка пар (координата, приоритет, номер) — O((2n + q) log(2n + q))</text></svg>