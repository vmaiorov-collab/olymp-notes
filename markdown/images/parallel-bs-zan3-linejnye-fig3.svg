<svg role="img" viewbox="0 0 760 292" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="292" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Одна координата — три вида событий; порядок: открыть, запрос, закрыть</text><rect fill="#27431f" height="54" rx="6" stroke="#83c167" stroke-width="2" width="190" x="80" y="70"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="175.0" y="101.9">открыть отрезок (+1)</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="175" y="150">приоритет 0</text><rect fill="#4d4d00" height="54" rx="6" stroke="#ffff00" stroke-width="2" width="190" x="310" y="70"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="405.0" y="101.9">запрос в точке x</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="405" y="150">приоритет 1</text><rect fill="#4f1f1b" height="54" rx="6" stroke="#fc6255" stroke-width="2" width="190" x="540" y="70"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="635.0" y="101.9">закрыть отрезок (−1)</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="635" y="150">приоритет 2</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="380" y="200">отрезок [l, r] включает обе границы: поэтому при равных координатах</text><text fill="#ffff00" font-size="14" font-weight="400" text-anchor="middle" x="380" y="224">сначала открываем, потом отвечаем, и только потом закрываем</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="270">сортировка пар (координата, приоритет, номер) — O((2n + q) log(2n + q))</text></svg>