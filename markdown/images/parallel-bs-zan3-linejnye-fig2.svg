<svg width="760" height="322" viewBox="0 0 760 322" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="322" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Сортировка по левому концу; R — самая правая уже учтённая граница</text><rect x="40" y="60" width="180" height="22" rx="5" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="52" y="76" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">1</text><rect x="140" y="94" width="190" height="22" rx="5" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="152" y="110" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">2</text><rect x="180" y="128" width="80" height="22" rx="5" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="192" y="144" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">3</text><rect x="400" y="162" width="140" height="22" rx="5" fill="#3a2858" stroke="#c78bff" stroke-width="2"/><text x="412" y="178" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">4</text><line x1="40" y1="215" x2="560" y2="215" stroke="#7c8aa0" stroke-width="2"/><line x1="330" y1="205" x2="330" y2="225" stroke="#ffff00" stroke-width="3"/><text x="330" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#ffff00">R после отрезка 2</text><text x="380" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">отрезок 3 целиком внутри (r ≤ R) — пропускаем;  отрезок 4 левее R не заходит — добавляем всю длину</text><text x="380" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">три случая: не пересекается · частично пересекается (добавляем r − R) · внутри (ничего)</text></svg>