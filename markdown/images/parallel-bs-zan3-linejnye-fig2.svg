<svg role="img" viewbox="0 0 760 322" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="322" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Сортировка по левому концу; R — самая правая уже учтённая граница</text><rect fill="#1d4257" height="22" rx="5" stroke="#58c4dd" stroke-width="2" width="180" x="40" y="60"></rect><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="52" y="76">1</text><rect fill="#27431f" height="22" rx="5" stroke="#83c167" stroke-width="2" width="190" x="140" y="94"></rect><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="152" y="110">2</text><rect fill="#53300a" height="22" rx="5" stroke="#ff8c1a" stroke-width="2" width="80" x="180" y="128"></rect><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="192" y="144">3</text><rect fill="#3a2858" height="22" rx="5" stroke="#c78bff" stroke-width="2" width="140" x="400" y="162"></rect><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="412" y="178">4</text><line stroke="#7c8aa0" stroke-width="2" x1="40" x2="560" y1="215" y2="215"></line><line stroke="#ffff00" stroke-width="3" x1="330" x2="330" y1="205" y2="225"></line><text fill="#ffff00" font-size="12" font-weight="400" text-anchor="middle" x="330" y="244">R после отрезка 2</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="280">отрезок 3 целиком внутри (r ≤ R) — пропускаем;  отрезок 4 левее R не заходит — добавляем всю длину</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="302">три случая: не пересекается · частично пересекается (добавляем r − R) · внутри (ничего)</text></svg>