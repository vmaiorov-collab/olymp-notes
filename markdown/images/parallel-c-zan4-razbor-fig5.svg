<svg role="img" viewbox="0 0 760 258" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="258" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="26">Жемчужины: k = 3 цвета, m = 2 (в группе разница позиций ≤ 2)</text><circle cx="70" cy="80" fill="#1d4257" r="24" stroke="#58c4dd" stroke-width="2"></circle><text fill="#dfe7f1" font-size="18" font-weight="400" text-anchor="middle" x="70" y="86.3">1</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="70" y="124">поз. 0</text><circle cx="170" cy="80" fill="#27431f" r="24" stroke="#83c167" stroke-width="2"></circle><text fill="#dfe7f1" font-size="18" font-weight="400" text-anchor="middle" x="170" y="86.3">2</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="170" y="124">поз. 1</text><circle cx="270" cy="80" fill="#27431f" r="24" stroke="#83c167" stroke-width="2"></circle><text fill="#dfe7f1" font-size="18" font-weight="400" text-anchor="middle" x="270" y="86.3">2</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="270" y="124">поз. 2</text><circle cx="370" cy="80" fill="#1d4257" r="24" stroke="#58c4dd" stroke-width="2"></circle><text fill="#dfe7f1" font-size="18" font-weight="400" text-anchor="middle" x="370" y="86.3">1</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="370" y="124">поз. 3</text><circle cx="470" cy="80" fill="#53300a" r="24" stroke="#ff8c1a" stroke-width="2"></circle><text fill="#dfe7f1" font-size="18" font-weight="400" text-anchor="middle" x="470" y="86.3">3</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="470" y="124">поз. 4</text><circle cx="570" cy="80" fill="#53300a" r="24" stroke="#ff8c1a" stroke-width="2"></circle><text fill="#dfe7f1" font-size="18" font-weight="400" text-anchor="middle" x="570" y="86.3">3</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="570" y="124">поз. 5</text><line stroke="#ffff00" stroke-width="4" x1="240" x2="500" y1="150" y2="150"></line><text fill="#ffff00" font-size="14" font-weight="400" text-anchor="middle" x="370" y="176">группа: позиции 2, 3, 4 — цвета 2, 1, 3</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="380" y="218">для каждого цвета — своя очередь позиций; позиции, отстоящие больше чем на m от текущей, из очередей удаляем</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="380" y="240">когда все k очередей непусты — берём из каждой первую позицию и закрываем группу</text></svg>