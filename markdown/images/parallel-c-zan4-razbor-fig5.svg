<svg width="760" height="258" viewBox="0 0 760 258" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="258" rx="14" fill="#141a24"/><text x="380" y="26" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Жемчужины: k = 3 цвета, m = 2 (в группе разница позиций ≤ 2)</text><circle cx="70" cy="80" r="24" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="70" y="86.3" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">1</text><text x="70" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">поз. 0</text><circle cx="170" cy="80" r="24" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="170" y="86.3" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">2</text><text x="170" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">поз. 1</text><circle cx="270" cy="80" r="24" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="270" y="86.3" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">2</text><text x="270" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">поз. 2</text><circle cx="370" cy="80" r="24" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="370" y="86.3" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">1</text><text x="370" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">поз. 3</text><circle cx="470" cy="80" r="24" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="470" y="86.3" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">3</text><text x="470" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">поз. 4</text><circle cx="570" cy="80" r="24" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="570" y="86.3" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">3</text><text x="570" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">поз. 5</text><line x1="240" y1="150" x2="500" y2="150" stroke="#ffff00" stroke-width="4"/><text x="370" y="176" text-anchor="middle" font-size="14" font-weight="400" fill="#ffff00">группа: позиции 2, 3, 4 — цвета 2, 1, 3</text><text x="380" y="218" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">для каждого цвета — своя очередь позиций; позиции, отстоящие больше чем на m от текущей, из очередей удаляем</text><text x="380" y="240" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">когда все k очередей непусты — берём из каждой первую позицию и закрываем группу</text></svg>