<svg role="img" viewbox="0 0 700 310" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="310" rx="14" width="700" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="28">Очередь = два стека; в каждой ячейке пара (число, минимум под ним)</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="118.0" y="282">вход — сюда приходят</text><line stroke="#7c8aa0" stroke-width="2" x1="62" x2="174" y1="260" y2="260"></line><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="96" x="70" y="222"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="118.0" y="243.9">(4, 4)</text><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="96" x="70" y="184"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="118.0" y="205.9">(2, 2)</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="96" x="70" y="146"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="118.0" y="167.9">(5, 2)</text><text fill="#dfe7f1" font-size="1" font-weight="400" text-anchor="middle" x="118" y="60"></text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="548.0" y="282">выход — отсюда уходят</text><line stroke="#7c8aa0" stroke-width="2" x1="492" x2="604" y1="260" y2="260"></line><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="96" x="500" y="222"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="548.0" y="243.9">(5, 5)</text><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="96" x="500" y="184"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="548.0" y="205.9">(2, 2)</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="96" x="500" y="146"></rect><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="548.0" y="167.9">(4, 2)</text><line marker-end="url(#ar)" stroke="#ffff00" stroke-width="3" x1="210" x2="480" y1="150" y2="150"></line><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="345" y="134">если выход пуст:</text><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="345" y="172">перекладываем всё сверху вниз</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="345" y="215">первым пришёл — окажется на вершине</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="middle" x="345" y="290">минимум очереди = min(минимум входа, минимум выхода)</text></svg>