<svg width="700" height="310" viewBox="0 0 700 310" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="700" height="310" rx="14" fill="#141a24"/><text x="380" y="28" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Очередь = два стека; в каждой ячейке пара (число, минимум под ним)</text><text x="118.0" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">вход — сюда приходят</text><line x1="62" y1="260" x2="174" y2="260" stroke="#7c8aa0" stroke-width="2"/><rect x="70" y="222" width="96" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="118.0" y="243.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">(4, 4)</text><rect x="70" y="184" width="96" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="118.0" y="205.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">(2, 2)</text><rect x="70" y="146" width="96" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="118.0" y="167.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">(5, 2)</text><text x="118" y="60" text-anchor="middle" font-size="1" font-weight="400" fill="#dfe7f1"></text><text x="548.0" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">выход — отсюда уходят</text><line x1="492" y1="260" x2="604" y2="260" stroke="#7c8aa0" stroke-width="2"/><rect x="500" y="222" width="96" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="548.0" y="243.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">(5, 5)</text><rect x="500" y="184" width="96" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="548.0" y="205.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">(2, 2)</text><rect x="500" y="146" width="96" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="548.0" y="167.9" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">(4, 2)</text><line x1="210" y1="150" x2="480" y2="150" stroke="#ffff00" stroke-width="3" marker-end="url(#ar)"/><text x="345" y="134" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">если выход пуст:</text><text x="345" y="172" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">перекладываем всё сверху вниз</text><text x="345" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">первым пришёл — окажется на вершине</text><text x="345" y="290" text-anchor="middle" font-size="14" font-weight="400" fill="#dfe7f1">минимум очереди = min(минимум входа, минимум выхода)</text></svg>