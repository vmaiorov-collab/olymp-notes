<svg role="img" viewbox="0 0 760 275" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="275" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="26">Две половины-дека: левая (|L| = |R| или |R|+1) и правая</text><rect fill="#1d4257" height="42" rx="6" stroke="#58c4dd" stroke-width="2" width="56" x="40" y="60"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="68.0" y="86.6">1</text><rect fill="#1d4257" height="42" rx="6" stroke="#58c4dd" stroke-width="2" width="56" x="102" y="60"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="130.0" y="86.6">2</text><rect fill="#1d4257" height="42" rx="6" stroke="#58c4dd" stroke-width="2" width="56" x="164" y="60"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="192.0" y="86.6">3</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="130" y="124">L — левая половина</text><rect fill="#27431f" height="42" rx="6" stroke="#83c167" stroke-width="2" width="56" x="440" y="60"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="468.0" y="86.6">4</text><rect fill="#27431f" height="42" rx="6" stroke="#83c167" stroke-width="2" width="56" x="502" y="60"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="530.0" y="86.6">5</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="500" y="124">R — правая половина</text><line stroke="#ffff00" stroke-dasharray="5 4" stroke-width="3" x1="372" x2="372" y1="50" y2="112"></line><text fill="#ffff00" font-size="12" font-weight="400" text-anchor="middle" x="372" y="44">середина</text><rect fill="#53300a" height="42" rx="6" stroke="#ff8c1a" stroke-width="2" width="56" x="300" y="160"></rect><text fill="#dfe7f1" font-size="16" font-weight="400" text-anchor="middle" x="328.0" y="186.6">6</text><line marker-end="url(#ar)" stroke="#ff8c1a" stroke-width="2" x1="328" x2="392" y1="158" y2="108"></line><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="250" y="232">вклиниться = положить в НАЧАЛО правой половины (push_front), потом выровнять размеры</text><text fill="#dfe7f1" font-size="13" font-weight="400" text-anchor="middle" x="250" y="256">уйти из начала — pop_front у L; прийти в конец — push_back у R</text></svg>