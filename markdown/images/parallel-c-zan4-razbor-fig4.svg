<svg width="760" height="275" viewBox="0 0 760 275" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="275" rx="14" fill="#141a24"/><text x="380" y="26" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Две половины-дека: левая (|L| = |R| или |R|+1) и правая</text><rect x="40" y="60" width="56" height="42" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="68.0" y="86.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">1</text><rect x="102" y="60" width="56" height="42" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="130.0" y="86.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">2</text><rect x="164" y="60" width="56" height="42" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="192.0" y="86.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">3</text><text x="130" y="124" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">L — левая половина</text><rect x="440" y="60" width="56" height="42" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="468.0" y="86.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">4</text><rect x="502" y="60" width="56" height="42" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="530.0" y="86.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">5</text><text x="500" y="124" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">R — правая половина</text><line x1="372" y1="50" x2="372" y2="112" stroke="#ffff00" stroke-width="3" stroke-dasharray="5 4"/><text x="372" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#ffff00">середина</text><rect x="300" y="160" width="56" height="42" rx="6" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="328.0" y="186.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">6</text><line x1="328" y1="158" x2="392" y2="108" stroke="#ff8c1a" stroke-width="2" marker-end="url(#ar)"/><text x="250" y="232" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">вклиниться = положить в НАЧАЛО правой половины (push_front), потом выровнять размеры</text><text x="250" y="256" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">уйти из начала — pop_front у L; прийти в конец — push_back у R</text></svg>