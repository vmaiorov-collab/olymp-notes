<svg width="760" height="292" viewBox="0 0 760 292" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="292" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Запрос на прямоугольник = 4 значения P: + − − +</text><rect x="120" y="50" width="360" height="220" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><rect x="120" y="50" width="110" height="220" fill="#4f1f1b" stroke="none" opacity=".75"/><rect x="120" y="50" width="360" height="70" fill="#53300a" stroke="none" opacity=".75"/><rect x="120" y="50" width="110" height="70" fill="#3a2858" stroke="none"/><rect x="230" y="120" width="250" height="150" fill="#27431f" stroke="#83c167" stroke-width="3"/><text x="355.0" y="195.0" text-anchor="middle" font-size="20" font-weight="700" fill="#83c167">ответ</text><text x="175" y="150" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">P[L−1][Y]</text><text x="175" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">вычесть</text><text x="355.0" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="#dfe7f1">P[R][X−1]: вычесть полосу слева</text><text x="175" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">+P[L−1][X−1]</text><text x="540" y="100" text-anchor="start" font-size="15" font-weight="400" fill="#dfe7f1">S = P[R][Y]</text><text x="540" y="124" text-anchor="start" font-size="15" font-weight="400" fill="#fc6255">− P[L−1][Y]</text><text x="540" y="148" text-anchor="start" font-size="15" font-weight="400" fill="#fc6255">− P[R][X−1]</text><text x="540" y="172" text-anchor="start" font-size="15" font-weight="400" fill="#ffff00">+ P[L−1][X−1]</text></svg>