<svg role="img" viewbox="0 0 760 260" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="260" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="26">Ограничение потока через вершину — раздвоение вершины</text><circle cx="110" cy="120" fill="#1d4257" r="24" stroke="#58c4dd" stroke-width="2"></circle><text fill="#dfe7f1" font-size="18" font-weight="400" text-anchor="middle" x="110" y="126.3">x</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="110" y="168">вершина с ограничением c</text><line marker-end="url(#ar)" stroke="#ffff00" stroke-width="3" x1="150" x2="230" y1="120" y2="120"></line><circle cx="330" cy="120" fill="#1E2836" r="20" stroke="#3b4a63" stroke-width="2"></circle><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="330" y="125.25">x₁</text><circle cx="520" cy="120" fill="#1E2836" r="20" stroke="#3b4a63" stroke-width="2"></circle><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="520" y="125.25">x₂</text><line marker-end="url(#ar)" stroke="#ff8c1a" stroke-width="4" x1="352" x2="496" y1="120" y2="120"></line><text fill="#ff8c1a" font-size="14" font-weight="400" text-anchor="middle" x="424" y="106">ёмкость c</text><line marker-end="url(#ar)" stroke="#3b4a63" stroke-width="2.5" x1="250" x2="312" y1="75" y2="106.5"></line><line marker-end="url(#ar)" stroke="#3b4a63" stroke-width="2.5" x1="540" x2="610" y1="106.5" y2="75"></line><line marker-end="url(#ar)" stroke="#3b4a63" stroke-width="2.5" x1="250" x2="312" y1="165" y2="133.5"></line><line marker-end="url(#ar)" stroke="#3b4a63" stroke-width="2.5" x1="540" x2="610" y1="133.5" y2="165"></line><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="280" y="62">входящие</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="middle" x="590" y="62">исходящие</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="215">все входящие рёбра идут в x₁, все исходящие выходят из x₂; новое ребро x₁→x₂ ограничивает поток</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="240">работает для ориентированного графа; неориентированное ребро сначала заменяют двумя ориентированными</text></svg>