<svg width="760" height="232" viewBox="0 0 760 232" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="232" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Две очереди: исходные числа (по возрастанию) и суммы (тоже по возрастанию)</text><text x="24" y="66" text-anchor="start" font-size="14" font-weight="400" fill="#9aa4b2">A:</text><rect x="60" y="46" width="50" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="85.0" y="68.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">3</text><rect x="116" y="46" width="50" height="34" rx="6" fill="#1E2836" stroke="#3b4a63" stroke-width="1.5"/><text x="141.0" y="68.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">5</text><rect x="172" y="46" width="50" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="197.0" y="68.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">6</text><rect x="228" y="46" width="50" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="253.0" y="68.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">7</text><rect x="284" y="46" width="50" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="309.0" y="68.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">7</text><rect x="340" y="46" width="50" height="34" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="365.0" y="68.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">8</text><text x="24" y="136" text-anchor="start" font-size="14" font-weight="400" fill="#9aa4b2">B:</text><rect x="60" y="116" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="85.0" y="138.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">8</text><rect x="116" y="116" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="141.0" y="138.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">13</text><rect x="172" y="116" width="50" height="34" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="197.0" y="138.25" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">15</text><text x="60" y="100" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">не обработаны ↑ (указатель i)</text><text x="60" y="172" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">первое число B ↑</text><text x="480" y="66" text-anchor="start" font-size="14" font-weight="400" fill="#ffff00">Кандидаты на слияние — только три пары:</text><text x="480" y="96" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">A[i] + A[i+1]</text><text x="480" y="120" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">A[i] + B[front]</text><text x="480" y="144" text-anchor="start" font-size="14" font-weight="400" fill="#dfe7f1">B[front] + B[front+1]</text><text x="380" y="212" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">новая сумма больше всех предыдущих → кладём в конец B, B остаётся отсортированной</text></svg>