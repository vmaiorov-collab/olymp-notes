<svg role="img" viewbox="0 0 760 232" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="232" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Две очереди: исходные числа (по возрастанию) и суммы (тоже по возрастанию)</text><text fill="#9aa4b2" font-size="14" font-weight="400" text-anchor="start" x="24" y="66">A:</text><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="50" x="60" y="46"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="85.0" y="68.25">3</text><rect fill="#1E2836" height="34" rx="6" stroke="#3b4a63" stroke-width="1.5" width="50" x="116" y="46"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="141.0" y="68.25">5</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="50" x="172" y="46"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="197.0" y="68.25">6</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="50" x="228" y="46"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="253.0" y="68.25">7</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="50" x="284" y="46"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="309.0" y="68.25">7</text><rect fill="#1d4257" height="34" rx="6" stroke="#58c4dd" stroke-width="2" width="50" x="340" y="46"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="365.0" y="68.25">8</text><text fill="#9aa4b2" font-size="14" font-weight="400" text-anchor="start" x="24" y="136">B:</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="50" x="60" y="116"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="85.0" y="138.25">8</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="50" x="116" y="116"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="141.0" y="138.25">13</text><rect fill="#27431f" height="34" rx="6" stroke="#83c167" stroke-width="2" width="50" x="172" y="116"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="197.0" y="138.25">15</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="start" x="60" y="100">не обработаны ↑ (указатель i)</text><text fill="#9aa4b2" font-size="12" font-weight="400" text-anchor="start" x="60" y="172">первое число B ↑</text><text fill="#ffff00" font-size="14" font-weight="400" text-anchor="start" x="480" y="66">Кандидаты на слияние — только три пары:</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="start" x="480" y="96">A[i] + A[i+1]</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="start" x="480" y="120">A[i] + B[front]</text><text fill="#dfe7f1" font-size="14" font-weight="400" text-anchor="start" x="480" y="144">B[front] + B[front+1]</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="212">новая сумма больше всех предыдущих → кладём в конец B, B остаётся отсортированной</text></svg>