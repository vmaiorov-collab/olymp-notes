ight="400" text-anchor="middle" x="595.0" y="93">i = 4</text><line stroke="#58c4dd" stroke-width="5" x1="110" x2="310" y1="128" y2="128"></line><line stroke="#83c167" stroke-width="5" x1="330" x2="530" y1="128" y2="128"></line><line stroke="#ff8c1a" stroke-width="5" x1="550" x2="640" y1="128" y2="128"></line><text fill="#58c4dd" font-size="13" font-weight="400" text-anchor="start" x="165" y="156">l ∈ {0, 1} → min = a[1] = 2</text><text fill="#83c167" font-size="13" font-weight="400" text-anchor="start" x="330" y="156">l ∈ {2, 3} → a[3] = 3</text><text fill="#ff8c1a" font-size="13" font-weight="400" text-anchor="start" x="510" y="182">l = 4 → a[4] = 4</text><text fill="#ffff00" font-size="15" font-weight="400" text-anchor="middle" x="380" y="232">минимум на [l, r] = a[ find(l) ] — ближайший справа к l элемент стека</text></svg>