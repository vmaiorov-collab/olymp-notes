<svg width="760" height="256" viewBox="0 0 760 256" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="256" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Префикс до r = 4: стек минимумов [1, 3, 4] и отрезки левых границ</text><rect x="110" y="60" width="90" height="40" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="155.0" y="78.0" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">5</text><text x="155.0" y="93" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">i = 0</text><rect x="220" y="60" width="90" height="40" rx="6" fill="#1d4257" stroke="#58c4dd" stroke-width="2"/><text x="265.0" y="78.0" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">2</text><text x="265.0" y="93" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">i = 1</text><rect x="330" y="60" width="90" height="40" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="375.0" y="78.0" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">6</text><text x="375.0" y="93" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">i = 2</text><rect x="440" y="60" width="90" height="40" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="485.0" y="78.0" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">3</text><text x="485.0" y="93" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">i = 3</text><rect x="550" y="60" width="90" height="40" rx="6" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="595.0" y="78.0" text-anchor="middle" font-size="18" font-weight="400" fill="#dfe7f1">4</text><text x="595.0" y="93" text-anchor="middle" font-size="11" font-weight="400" fill="#9aa4b2">i = 4</text><line x1="110" y1="128" x2="310" y2="128" stroke="#58c4dd" stroke-width="5"/><line x1="330" y1="128" x2="530" y2="128" stroke="#83c167" stroke-width="5"/><line x1="550" y1="128" x2="640" y2="128" stroke="#ff8c1a" stroke-width="5"/><text x="165" y="156" text-anchor="start" font-size="13" font-weight="400" fill="#58c4dd">l ∈ {0, 1} → min = a[1] = 2</text><text x="330" y="156" text-anchor="start" font-size="13" font-weight="400" fill="#83c167">l ∈ {2, 3} → a[3] = 3</text><text x="510" y="182" text-anchor="start" font-size="13" font-weight="400" fill="#ff8c1a">l = 4 → a[4] = 4</text><text x="380" y="232" text-anchor="middle" font-size="15" font-weight="400" fill="#ffff00">минимум на [l, r] = a[ find(l) ] — ближайший справа к l элемент стека</text></svg>