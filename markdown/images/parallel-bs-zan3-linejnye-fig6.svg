<svg width="760" height="275" viewBox="0 0 760 275" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="275" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Сумма минимумов: каждый a[i] минимален в (i − L) · (R − i) подотрезках</text><rect x="90" y="112" width="94" height="78" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="137.0" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">3</text><rect x="190" y="164" width="94" height="26" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="237.0" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">1</text><rect x="290" y="86" width="94" height="104" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="337.0" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">4</text><rect x="390" y="164" width="94" height="26" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="437.0" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">1</text><rect x="490" y="60" width="94" height="130" fill="#1E2836" stroke="#3b4a63" stroke-width="2"/><text x="537.0" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">5</text><rect x="190" y="50" width="294" height="140" fill="none" stroke="#ffff00" stroke-width="2" stroke-dasharray="6 4"/><text x="340.0" y="42" text-anchor="middle" font-size="12" font-weight="400" fill="#ffff00">i=2: слева ближайший ≤ — позиция 1, справа ближайший &lt; — позиция 5 (нет)</text><text x="380" y="255" text-anchor="middle" font-size="12" font-weight="400" fill="#9aa4b2">для равных нужно сломать симметрию: слева «≤», справа «&lt;» (или наоборот) — иначе подотрезок с двумя равными минимумами теряется</text></svg>