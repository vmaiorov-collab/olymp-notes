nt-weight="400" fill="#dfe7f1">1</text><text x="24" y="150" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">цепочка 2</text><rect x="144.0" y="126" width="96" height="40" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="192.0" y="151.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">5</text><text x="236" y="152" text-anchor="middle" font-size="18" font-weight="400" fill="#9aa4b2">⊃</text><rect x="266.0" y="126" width="72" height="40" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="302.0" y="151.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">3</text><text x="346" y="152" text-anchor="middle" font-size="18" font-weight="400" fill="#9aa4b2">⊃</text><rect x="382.0" y="126" width="60" height="40" rx="6" fill="#27431f" stroke="#83c167" stroke-width="2"/><text x="412.0" y="151.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">2</text><text x="24" y="216" text-anchor="start" font-size="12" font-weight="400" fill="#9aa4b2">цепочка 3</text><rect x="156.0" y="192" width="72" height="40" rx="6" fill="#53300a" stroke="#ff8c1a" stroke-width="2"/><text x="192.0" y="217.6" text-anchor="middle" font-size="16" font-weight="400" fill="#dfe7f1">3</text><text x="380" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">Три тройки не могут лежать в одной цепочке (равные коробки не вкладываются) → нужно ≥ 3.</text><text x="380" y="292" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">Строим 3 цепочки: j-я копия каждого размера уходит в цепочку j — внутри цепочки размеры строго убывают.</text></svg>