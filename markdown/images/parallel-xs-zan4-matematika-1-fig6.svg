<svg width="760" height="348" viewBox="0 0 760 348" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/></marker></defs><rect x="0" y="0" width="760" height="348" rx="14" fill="#141a24"/><text x="380" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#dfe7f1">Пары центров (i, j) → точки и прямоугольники → сканлайн</text><line x1="60" y1="260" x2="700" y2="260" stroke="#7c8aa0" stroke-width="1.5" marker-end="url(#ar)"/><line x1="60" y1="260" x2="60" y2="40" stroke="#7c8aa0" stroke-width="1.5" marker-end="url(#ar)"/><text x="700" y="280" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">i</text><text x="40" y="40" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">2w</text><circle cx="120" cy="220" r="5" fill="#58c4dd"/><circle cx="200" cy="150" r="5" fill="#58c4dd"/><circle cx="260" cy="190" r="5" fill="#58c4dd"/><circle cx="340" cy="100" r="5" fill="#58c4dd"/><circle cx="420" cy="170" r="5" fill="#58c4dd"/><circle cx="500" cy="130" r="5" fill="#58c4dd"/><rect x="230" y="110" width="200" height="100" fill="#27431f" stroke="#83c167" stroke-width="2" opacity=".85"/><text x="330" y="98" text-anchor="middle" font-size="13" font-weight="400" fill="#83c167">прямоугольник центра j</text><text x="380" y="306" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa4b2">точка i внутри прямоугольника j  ⇔  палиндромы вокруг i и j достают друг до друга</text><text x="380" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#ffff00">считаем точки в «четверти» и вычитаем: событийная сортировка + дерево Фенвика</text></svg>