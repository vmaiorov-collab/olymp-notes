<svg role="img" viewbox="0 0 760 348" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="8" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"></path></marker></defs><rect fill="#141a24" height="348" rx="14" width="760" x="0" y="0"></rect><text fill="#dfe7f1" font-size="15" font-weight="400" text-anchor="middle" x="380" y="24">Пары центров (i, j) → точки и прямоугольники → сканлайн</text><line marker-end="url(#ar)" stroke="#7c8aa0" stroke-width="1.5" x1="60" x2="700" y1="260" y2="260"></line><line marker-end="url(#ar)" stroke="#7c8aa0" stroke-width="1.5" x1="60" x2="60" y1="260" y2="40"></line><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="700" y="280">i</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="40" y="40">2w</text><circle cx="120" cy="220" fill="#58c4dd" r="5"></circle><circle cx="200" cy="150" fill="#58c4dd" r="5"></circle><circle cx="260" cy="190" fill="#58c4dd" r="5"></circle><circle cx="340" cy="100" fill="#58c4dd" r="5"></circle><circle cx="420" cy="170" fill="#58c4dd" r="5"></circle><circle cx="500" cy="130" fill="#58c4dd" r="5"></circle><rect fill="#27431f" height="100" opacity=".85" stroke="#83c167" stroke-width="2" width="200" x="230" y="110"></rect><text fill="#83c167" font-size="13" font-weight="400" text-anchor="middle" x="330" y="98">прямоугольник центра j</text><text fill="#9aa4b2" font-size="13" font-weight="400" text-anchor="middle" x="380" y="306">точка i внутри прямоугольника j  ⇔  палиндромы вокруг i и j достают друг до друга</text><text fill="#ffff00" font-size="13" font-weight="400" text-anchor="middle" x="380" y="328">считаем точки в «четверти» и вычитаем: событийная сортировка + дерево Фенвика</text></svg>